<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CV Media Computindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="responsive.css?v=20261015">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
        <div class="w-32 h-32 flex items-center justify-center mx-auto mb-4">
            <img src="ikonek.png" alt="Logo CV Media Computindo" class="w-full h-full object-contain">
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">I Konek</h1>
        <p class="text-gray-500 text-sm mt-1">Sistem Manajemen Inventory & Pemasangan</p>
    </div>

    <form id="loginForm" class="space-y-5" autocomplete="off">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required autocomplete="new-password"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required autocomplete="new-password"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95">
            Masuk
        </button>
    </form>


<script src="script.js"></script>
</body>
</html>
